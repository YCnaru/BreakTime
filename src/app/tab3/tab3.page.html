<ion-header><ion-toolbar><ion-title>Configuración</ion-title></ion-toolbar></ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item><ion-label>Intervalo:</ion-label>
      <ion-select [(ngModel)]="intervalo"><ion-select-option value="20">20 min</ion-select-option><ion-select-option value="45">45 min</ion-select-option></ion-select>
    </ion-item>
    <ion-item><ion-label>Vibración:</ion-label><ion-toggle [(ngModel)]="vibracion" slot="end"></ion-toggle></ion-item>
    <ion-item><ion-label>Modo Oscuro:</ion-label><ion-toggle [(ngModel)]="modoOscuro" (ionChange)="cambiarModo()" slot="end"></ion-toggle></ion-item>
  </ion-list>
</ion-content>
