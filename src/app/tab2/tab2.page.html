<ion-header><ion-toolbar><ion-title>{{ tituloPantalla }}</ion-title></ion-toolbar></ion-header>

<ion-content class="ion-padding">
  @if (!categoriaActiva) {
    <ion-grid>
      <ion-row>
        <ion-col size="6" *ngFor="let cat of ['ojos', 'espalda', 'cuello', 'manos']">
          <div class="cat-card" (click)="seleccionarCategoria(cat)">
            <ion-icon [name]="cat + '-icon'"></ion-icon>
            <p>{{ cat | titlecase }}</p>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  } @else {
    <ion-list>
      <ion-item *ngFor="let paso of contenidoPausas[categoriaActiva].pasos">
        <ion-icon slot="start" [name]="paso.icon"></ion-icon>
        <ion-label>{{ paso.texto }}</ion-label>
      </ion-item>
    </ion-list>
    <div class="center"><ion-button (click)="finalizarPausa()" fill="outline">Finalizar</ion-button></div>
  }
</ion-content>
